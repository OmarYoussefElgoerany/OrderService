# Application
spring.application.name=orders
# ========================================
# PostgreSQL Database
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================
# JPA / Hibernate
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================================
#Security
application.security.jwt.secret-key=${JWT_SECRET}
# 15 minutes
application.security.jwt.expiration=900000
# 7 days
application.security.jwt.refresh-token.expiration=604800000
# Server
# ========================================
server.port=8080
# Comma-separated exact browser origins; wildcards are not allowed with credentialed CORS.
application.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc.swagger-ui.with-credentials=true
